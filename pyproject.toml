[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wheather-predictor"
version = "0.2.0"
description = "Small, reproducible station-weather forecasting tools"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
weather-predictor = "weather_predictor.cli:main"

[tool.setuptools.packages.find]
include = ["weather_predictor*"]
