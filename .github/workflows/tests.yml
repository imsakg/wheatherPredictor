name: offline-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tooling
        run: python -m pip install build
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile maintained code and opt-in legacy entrypoints
        run: python -m compileall -q weather_predictor examples tests predictor.py parser.py scraper.py
      - name: Real station demo
        run: python -m examples.offline_demo --output .cache/demo
      - name: Build wheel and source distribution
        run: python -m build
      - name: Installed entrypoint outside checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          weather-predictor --help
